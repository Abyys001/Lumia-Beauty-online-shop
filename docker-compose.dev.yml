# Development overlay — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Access: http://localhost:3000 (frontend)  http://localhost:8000 (backend / django-admin)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - media_data:/app/media
    environment:
      APP_ENV: development
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      ADMIN_BYPASS_PHONE: ${ADMIN_BYPASS_PHONE:-09916122680}
    ports:
      - "${BACKEND_HTTP_PORT:-8000}:8000"
    develop:
      watch:
        - path: ./backend/requirements.txt
          action: rebuild

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      APP_ENV: development
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3000/api}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:3000"
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild

volumes:
  frontend_node_modules:
