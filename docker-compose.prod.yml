# =============================================================================
# Production overlay for a single VPS — adds Nginx (TLS termination) + Certbot
# on top of the 4-container stack in docker-compose.yml.
#
# The backend/frontend images referenced in docker-compose.yml
# (BACKEND_IMAGE / FRONTEND_IMAGE) must be built & pushed first:
#   ./scripts/build-and-push.sh          # on your machine (after `docker login`)
#
# Then, on the server:
#   cp .env.vps .env                     # fill in the real secrets first
#   docker compose pull                  # pull the prebuilt images
#   ./scripts/init-letsencrypt.sh        # one-time: obtain the Let's Encrypt cert
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  backend:
    # Share collectstatic output with nginx (STATIC_ROOT = /app/staticfiles).
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks:
      - lumia_net
    # Reload every 6h so renewed certificates are picked up without a restart.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Attempt renewal every 12h; certbot only acts when a cert is near expiry.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  static_data:
