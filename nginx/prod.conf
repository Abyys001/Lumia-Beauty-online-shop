# Production reverse proxy for lumiabeauty.ir — TLS termination + routing.
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
# Certificates + TLS params live under /etc/letsencrypt (certbot volume);
# they are created by scripts/init-letsencrypt.sh before nginx first starts.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ---- HTTP: serve ACME challenge, redirect everything else to HTTPS ----------
server {
    listen 80;
    server_name lumiabeauty.ir www.lumiabeauty.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: the real site ----------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name lumiabeauty.ir www.lumiabeauty.ir;

    ssl_certificate     /etc/letsencrypt/live/lumiabeauty.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumiabeauty.ir/privkey.pem;

    # Mozilla "intermediate", ECDHE-only (no ssl_dhparam file needed).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location /django-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # collectstatic output (shared static_data volume); falls back to WhiteNoise.
    location /static/ {
        root /var/www;
        try_files $uri @backend_static;
        expires 7d;
        add_header Cache-Control "public";
    }
    location @backend_static {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media (shared media_data volume); falls back to Django.
    location /media/ {
        root /var/www;
        try_files $uri @backend_media;
        expires 7d;
        add_header Cache-Control "public";
    }
    location @backend_media {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap is generated by the Nuxt/Nitro server.
    location ~ ^(/sitemap\.xml|/__sitemap__/) {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Nuxt SSR app (serves pages and built /_nuxt/ assets).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Map for safe WebSocket upgrade handling on the / location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
