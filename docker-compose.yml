# Production-oriented Compose for PaaS platforms that disallow the `build` block
# and local bind-mounts (images are pulled from a remote registry instead).
# Edge proxy routes /api, /static, /media, /django-admin → backend:8000 and / → frontend:3000.
#
# Production:
#   docker login <registry>
#   docker compose pull
#   docker compose up -d
#   (see README/deploy docs for the build+push commands that produce these images)
#
# Local development (hot-reload, no Nginx, builds from source):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 400m
    command: >
      sh -c "
        mkdir -p /tmp/postgresql &&
        ln -sf /tmp/postgresql /var/run/postgresql &&
        exec postgres
        -c shared_buffers=96MB
        -c effective_cache_size=192MB
        -c work_mem=4MB
        -c maintenance_work_mem=32MB
        -c max_connections=50
      "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumia_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-lumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumia_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-lumia} -d ${POSTGRES_DB:-lumia_beauty}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lumia_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 150m
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lumia_net

  backend:
    image: ${BACKEND_IMAGE:-siavashdev/lumia-backend:latest}
    restart: unless-stopped
    volumes:
      - media_data:/app/media
    environment:
      APP_ENV: ${APP_ENV:-production}
      USE_SQLITE: "False"
      POSTGRES_DB: ${POSTGRES_DB:-lumia_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-lumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumia_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_OTP_DEBUG_CODE: ${DJANGO_OTP_DEBUG_CODE:-False}
      OTP_DISABLE_RATE_LIMIT: ${OTP_DISABLE_RATE_LIMIT:-False}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-True}
      ZARINPAL_MOCK: ${ZARINPAL_MOCK:-True}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-http://localhost/api/payments/zarinpal/verify/}
      ZARINPAL_CLIENT_ID: ${ZARINPAL_CLIENT_ID:-}
      ZARINPAL_CLIENT_SECRET: ${ZARINPAL_CLIENT_SECRET:-}
      ZARINPAL_TERMINAL_ID: ${ZARINPAL_TERMINAL_ID:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-smsir}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_SANDBOX_API_KEY: ${SMS_IR_SANDBOX_API_KEY:-}
      SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID:-394212}
      SMS_IR_BASE_URL: ${SMS_IR_BASE_URL:-https://api.sms.ir/v1}
      SMS_IR_SANDBOX: ${SMS_IR_SANDBOX:-False}
      IRANPAYAMAK_API_KEY: ${IRANPAYAMAK_API_KEY:-}
      IRANPAYAMAK_LINE_NUMBER: ${IRANPAYAMAK_LINE_NUMBER:-}
      IRANPAYAMAK_PATTERN_CODE: ${IRANPAYAMAK_PATTERN_CODE:-}
      IRANPAYAMAK_BASE_URL: ${IRANPAYAMAK_BASE_URL:-https://api.iranpayamak.com}
      ADMIN_BYPASS_PHONE: ${ADMIN_BYPASS_PHONE:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumia_net

  frontend:
    image: ${FRONTEND_IMAGE:-siavashdev/lumia-frontend:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost/api}
      NUXT_API_INTERNAL_URL: ${NUXT_API_INTERNAL_URL:-http://backend:8000/api}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      NUXT_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      NUXT_HOST: ${NUXT_HOST:-0.0.0.0}
      NUXT_PORT: ${NUXT_PORT:-3000}
    depends_on:
      - backend
    networks:
      - lumia_net

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  lumia_net:
    driver: bridge
