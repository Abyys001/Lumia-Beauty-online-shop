# Unified Compose — development & production via APP_ENV in .env
# Development (default): code is volume-mounted; Django runserver + Nuxt dev hot-reload.
# Production: set APP_ENV=production and DJANGO_DEBUG=False in .env
#
# First time only:  docker compose up -d --build
# Daily dev:        docker compose up -d          (no --build needed)
# Auto watch:        docker compose watch          (rebuilds image only when deps change)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumia_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-lumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumia_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumia} -d ${POSTGRES_DB:-lumia_beauty}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lumia_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lumia_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    environment:
      APP_ENV: ${APP_ENV:-development}
      USE_SQLITE: "False"
      POSTGRES_DB: ${POSTGRES_DB:-lumia_beauty}
      POSTGRES_USER: ${POSTGRES_USER:-lumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumia_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_OTP_DEBUG_CODE: ${DJANGO_OTP_DEBUG_CODE:-False}
      OTP_DISABLE_RATE_LIMIT: ${OTP_DISABLE_RATE_LIMIT:-True}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-True}
      ZARINPAL_MOCK: ${ZARINPAL_MOCK:-True}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-http://localhost/api/payments/zarinpal/verify/}
      ZARINPAL_CLIENT_ID: ${ZARINPAL_CLIENT_ID:-}
      ZARINPAL_CLIENT_SECRET: ${ZARINPAL_CLIENT_SECRET:-}
      ZARINPAL_TERMINAL_ID: ${ZARINPAL_TERMINAL_ID:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-smsir}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_SANDBOX_API_KEY: ${SMS_IR_SANDBOX_API_KEY:-}
      SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID:-394212}
      SMS_IR_BASE_URL: ${SMS_IR_BASE_URL:-https://api.sms.ir/v1}
      SMS_IR_SANDBOX: ${SMS_IR_SANDBOX:-False}
      IRANPAYAMAK_API_KEY: ${IRANPAYAMAK_API_KEY:-}
      IRANPAYAMAK_LINE_NUMBER: ${IRANPAYAMAK_LINE_NUMBER:-}
      IRANPAYAMAK_PATTERN_CODE: ${IRANPAYAMAK_PATTERN_CODE:-}
      IRANPAYAMAK_BASE_URL: ${IRANPAYAMAK_BASE_URL:-https://api.iranpayamak.com}
      ADMIN_BYPASS_PHONE: ${ADMIN_BYPASS_PHONE:-09916122680}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lumia_net
    develop:
      watch:
        - path: ./backend/requirements.txt
          action: rebuild

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      APP_ENV: ${APP_ENV:-development}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost/api}
      NUXT_API_INTERNAL_URL: http://backend:8000/api
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      NUXT_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      NUXT_HOST: ${NUXT_HOST:-0.0.0.0}
      NUXT_PORT: ${NUXT_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      NUXT_VITE_CLIENT_PORT: "80"
    depends_on:
      - backend
    networks:
      - lumia_net
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - lumia_net

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  frontend_node_modules:

networks:
  lumia_net:
    driver: bridge
